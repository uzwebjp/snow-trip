name: snow forecast

on:
  schedule:
    # 予報の更新: 11〜5月の JST 16:17 / 20:17 / 0:17 / 4:17（UTC 07 / 11 / 15 / 19 時17分）
    # 毎時0分ちょうどは GitHub が混んで遅延・欠落しやすいので分をずらしている
    - cron: "17 7,11,15,19 * 11,12,1-5 *"
    # 公開リポジトリは60日間動きが無いと定期実行が止まるので、通年で毎週有効化し直す（月曜 JST 12:43）
    - cron: "43 3 * * 1"
  workflow_dispatch:        # 手動実行ボタン（シーズン外でも更新できる）

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # keepalive でワークフローを有効化し直すため

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  keepalive:
    if: github.event.schedule == '43 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: 定期実行が止まらないように有効化し直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/snow.yml/enable"

  build:
    if: github.event.schedule != '43 3 * * 1'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo        # これが無いとランナーのUTCで日付がずれる
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 予報を計算してHTMLを生成
        run: |
          mkdir -p site
          python snow_tonight.py --today --nav --out site/index.html
          python snow_tonight.py --trip  --nav --out site/all.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
