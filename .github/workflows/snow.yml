name: snow forecast

on:
  schedule:
    # JST 16:00 / 20:00 / 24:00 / 翌04:00 （UTC 07 / 11 / 15 / 19）
    - cron: "0 7,11,15,19 * * *"
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo        # これが無いとランナーのUTCで日付がずれる
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 予報を計算してHTMLを生成
        run: |
          mkdir -p site
          python snow_tonight.py --today --out site/index.html
          python snow_tonight.py --trip  --out site/all.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
